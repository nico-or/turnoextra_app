#cloud-config
package_update: true
package_upgrade: true

packages:
  - htop
  - docker.io
  - docker-compose
  - nginx
  - fail2ban
  - ufw

users:
  - name: turnoextra
    groups: [sudo, docker]
    shell: /bin/bash
    sudo: "ALL=(ALL) NOPASSWD:ALL"
    ssh_authorized_keys:
      - ssh-rsa  nicolas@lga1200

write_files:
  - path: /etc/ssh/sshd_config.d/99-custom.conf
    content: |
      PasswordAuthentication no
      PermitRootLogin no

  - path: /etc/docker/daemon.json
    content: |
      {
        "log-driver": "json-file",
        "log-opts": {
          "max-size": "10m",
          "max-file": "3",
          "compress": "true"
        }
      }
    owner: root:root
    permissions: "0644"

runcmd:
  - ufw allow OpenSSH
  - ufw allow 'Nginx Full'
  - ufw --force enable
  - systemctl enable --now fail2ban
  - systemctl enable --now docker
  - systemctl restart ssh
